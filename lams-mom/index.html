<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17201a">
  <meta name="description" content="Một ngày trên đồng cỏ cùng Lam’s Mom. Bốn thước phim từ nắng sớm đến đêm yên.">
  <title>Lam’s Mom — Một ngày trên đồng cỏ</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#story">Đến câu chuyện</a>
  <main>
    <section class="journey" aria-label="Một ngày trên đồng cỏ">
      <div class="stage">
        <div class="footage" aria-hidden="true">
          <div class="shot" style="--frame: 53% 55%">
            <img src="assets/pasture.webp" alt="" width="1600" height="900" fetchpriority="high">
            <video data-src="assets/dawn.mp4" muted loop playsinline preload="none"></video>
          </div>
          <div class="shot" style="--frame: 56% 53%">
            <img data-src="assets/noon.webp" alt="" width="720" height="406">
            <video data-src="assets/noon.mp4" muted loop playsinline preload="none"></video>
          </div>
          <div class="shot" style="--frame: 49% 53%">
            <img data-src="assets/dusk.webp" alt="" width="720" height="406">
            <video data-src="assets/dusk.mp4" muted loop playsinline preload="none"></video>
          </div>
          <div class="shot" style="--frame: 47% 55%">
            <img data-src="assets/night.webp" alt="" width="720" height="406">
            <video data-src="assets/night.mp4" muted loop playsinline preload="none"></video>
          </div>
        </div>
        <div class="veil"></div>
        <div class="copy">
          <h1 id="chapter-title">Một ngày trên đồng cỏ</h1>
        </div>
        <div class="stage-footer">
          <div class="timeline">
            <span id="clock">06:00</span>
            <span class="track" aria-hidden="true"><i></i></span>
            <svg class="scroll-cue" aria-hidden="true" viewBox="0 0 16 16"><path d="M8 3v10m-4-4 4 4 4-4"/></svg>
          </div>
          <button type="button" class="motion-toggle" aria-label="Dừng video" title="Dừng video" hidden>
            <svg class="motion-icon" aria-hidden="true" viewBox="0 0 16 16"><path d="M6 4v8m4-8v8"/></svg>
          </button>
        </div>
      </div>
    </section>
    <section class="story" id="story">
      <div>
        <p class="eyebrow">LAM’S MOM</p>
        <h2>Từ đồng cỏ đến bàn ăn.</h2>
        <p>Thịt bò cho bữa cơm gia đình và gian bếp chuyên nghiệp.</p>
        <small>Hình ảnh đồng cỏ và video mang tính minh họa.</small>
      </div>
      <img src="assets/pasture.webp" alt="Đàn bò trên những triền đồi xanh dưới ánh nắng sớm" width="1600" height="900" loading="lazy">
    </section>
  </main>
</body>
</html>
